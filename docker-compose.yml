# docker compose up -d      sobe o PostgreSQL e um container com o Rails e o Vite
# docker compose up -d db   sobe só o PostgreSQL
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /app/bin/dev
    init: true
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Dependências ficam em volumes para não misturar com as instaladas na máquina.
      - bundle:/usr/local/bundle
      - node_modules:/app/web/node_modules

  # Acesso ao banco de produção. Não sobe com o `up`; é usado só pelo bin/prod-rails.
  prod-sql-proxy:
    profiles: [prod-sql]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    user: "${PROXY_UID:-1000}"
    command: ["--address", "0.0.0.0", "--port", "5432", "${CLOUD_SQL_INSTANCE:-}"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/adc.json:ro

volumes:
  pgdata:
  bundle:
  node_modules:
