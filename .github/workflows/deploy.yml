# Publica no Cloud Run a cada merge na main, se o CI passar. Guia: docs/deploy-gcp.md
# Enquanto as variáveis do repositório não existirem, a publicação é ignorada.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publicações em sequência, nunca canceladas no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # login no Google sem chave guardada no GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: bin/deploy-gcp
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
