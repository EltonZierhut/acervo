pt-BR:
  activerecord:
    models:
      codes/project: Projeto
      codes/snippet: Código
      user: Usuário
      initiatives/context: Contexto
      initiatives/initiative: Iniciativa
      initiatives/milestone: Marco
      initiatives/task: Tarefa
    attributes:
      user:
        email_address: E-mail
        password: Senha
        password_confirmation: Confirmação da senha
      codes/project:
        name: Nome
        description: Descrição
        repository_url: URL do repositório
        tags: Tags
      initiatives/context:
        name: Nome
        color: Cor
      initiatives/initiative:
        name: Nome
        description: Descrição
        context_id: Contexto
        status: Status
        priority: Prioridade
        starts_on: Data de início
        due_on: Data-alvo
        tags: Tags
        sections: Seções
      initiatives/milestone:
        title: Título
        description: Descrição
        due_on: Data-alvo
      initiatives/task:
        title: Título
        description: Descrição
        status: Status
        priority: Prioridade
        due_on: Prazo
        milestone_id: Marco
      codes/snippet:
        title: Título
        description: Descrição
        language: Linguagem
        content: Código
        tags: Tags
        project: Projeto
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: não pode ficar em branco
      taken: já está em uso
      too_long: é muito longo (máximo %{count} caracteres)
      too_short: é muito curta (mínimo %{count} caracteres)
      confirmation: não confere com %{attribute}
      password_too_long: é muito longa
      invalid: não é válido
      required: é obrigatório
      inclusion: não está incluído na lista
